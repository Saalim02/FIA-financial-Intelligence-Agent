model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  max_seq_length: 1024

training:
  output_dir: fine_tuning/output
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  logging_steps: 1
  save_strategy: epoch
  evaluation_strategy: epoch

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

quantization:
  enabled: true
  bits: 4
