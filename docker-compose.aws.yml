services:

  backend:
    image: 340290106613.dkr.ecr.ap-south-1.amazonaws.com/fia-backend:${FIA_IMAGE_TAG:-latest}

    container_name: fia-backend

    ports:
      - "8000:8000"

    env_file:
      - .env.aws

    environment:
      FINANCIAL_REASONING_PROVIDER: openai
      FRONTEND_ORIGINS: http://3.6.100.42:5173

    restart: unless-stopped

  frontend:
    image: 340290106613.dkr.ecr.ap-south-1.amazonaws.com/fia-frontend:${FIA_IMAGE_TAG:-latest}

    container_name: fia-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped
