services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.cpu

    container_name: fia-backend

    ports:
      - "8000:8000"

    env_file:
      - .env.aws

    environment:
      FINANCIAL_REASONING_PROVIDER: openai

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: fia-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped
