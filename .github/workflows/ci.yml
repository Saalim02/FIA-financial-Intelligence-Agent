name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "340290106613"
  ECR_BACKEND: fia-backend
  ECR_FRONTEND: fia-frontend
  EC2_INSTANCE_ID: i-05d81461c866ca7d7

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ci-test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q tests

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -f Dockerfile.cpu \
            -t fia-backend:ci \
            .

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t fia-frontend:ci \
            ./frontend

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::340290106613:role/FIA-GitHub-Actions-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -f Dockerfile.cpu \
            -t ${{ env.ECR_BACKEND }}:${{ github.sha }} \
            -t ${{ env.ECR_BACKEND }}:latest \
            .

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t ${{ env.ECR_FRONTEND }}:${{ github.sha }} \
            -t ${{ env.ECR_FRONTEND }}:latest \
            ./frontend

      - name: Tag backend for ECR
        run: |
          docker tag \
            ${{ env.ECR_BACKEND }}:${{ github.sha }} \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND }}:${{ github.sha }}

          docker tag \
            ${{ env.ECR_BACKEND }}:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND }}:latest

      - name: Tag frontend for ECR
        run: |
          docker tag \
            ${{ env.ECR_FRONTEND }}:${{ github.sha }} \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_FRONTEND }}:${{ github.sha }}

          docker tag \
            ${{ env.ECR_FRONTEND }}:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_FRONTEND }}:latest

      - name: Push backend to ECR
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND }}:${{ github.sha }}

          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND }}:latest

      - name: Push frontend to ECR
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_FRONTEND }}:${{ github.sha }}

          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_FRONTEND }}:latest

      - name: Deploy through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "FIA deployment ${{ github.sha }}" \
            --parameters commands='[
              "cd ~/financial-intelligence-engine",
              "export FIA_IMAGE_TAG=${{ github.sha }}",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 340290106613.dkr.ecr.ap-south-1.amazonaws.com",
              "docker compose -f docker-compose.aws.yml pull",
              "docker compose -f docker-compose.aws.yml up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

      - name: Health check
        run: |
          for i in {1..12}; do
            if curl -fsS http://13.235.42.215:8000/health; then
              echo "Backend health check passed"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 10
          done

          echo "Backend health check failed"
          exit 1
